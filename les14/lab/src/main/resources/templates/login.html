<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body { font-family: Segoe UI, Arial, sans-serif; background: #f7f4ef; }
        .box { max-width: 360px; margin: 80px auto; background: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        label { display: block; margin-top: 10px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { margin-top: 14px; width: 100%; padding: 10px; background: #5b3a8c; color: #fff; border: 0; border-radius: 6px; }
        .msg { margin-top: 12px; }
        .err { color: #b00020; }
        .ok { color: #0a7a2f; }
        .hint { font-size: 13px; color: #666; margin-top: 16px; }
    </style>
</head>
<body>
<div class="box">
    <h2>Вход в магазин</h2>
    <form th:action="@{/login}" method="post">
        <label>Логин</label>
        <input type="text" name="username" required>
        <label>Пароль</label>
        <input type="password" name="password" required>
        <button type="submit">Войти</button>
    </form>
    <p class="msg err" th:if="${param.error}">Неверный логин или пароль</p>
    <p class="msg ok" th:if="${param.logout}">Вы вышли из системы</p>
    <div class="hint">
        user / user — только просмотр<br>
        manager / manager — все операции
    </div>
</div>
</body>
</html>
